server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    model/gltf-binary glb;
    image/webp webp;
    application/wasm wasm;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  location /models/ { add_header Cache-Control "public, max-age=86400"; }
  location /draco/  { add_header Cache-Control "public, max-age=604800"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
