services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules          # no pisar las dependencias del contenedor con las del host
    environment:
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}   # poner true solo si el repo está en /mnt/c o /mnt/d

  web:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    restart: unless-stopped
